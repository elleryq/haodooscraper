{% macro render_pagination(pagination) %}
<nav aria-label="Page navigation">
  <ul class="pagination justify-content-between">
  {% if pagination.has_prev %}
    <li class="page-item"><a class="page-link" href="{{ url_for_other_page(pagination.page - 1) }}">上一頁</a></li>
  {% else %}
    <li class="page-item invisible"><span class="page-link">上一頁</span></li>
  {% endif %}
  {% if pagination.has_next %}
    <li class="page-item"><a class="page-link" href="{{ url_for_other_page(pagination.page + 1) }}">下一頁</a></li>
  {% endif %}
  </ul>
</nav>
{% endmacro %}
