[project]
name = "haodooscraper"
version = "1.0"
description = "Scraper for haodoo.net and a Flask web app to search the scraped books"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0",
    "cssselect>=1.3",
    "flask>=3.1",
    "flask-bootstrap>=3.3.7.1",
    "flask-restx>=1.3",
    "lxml>=6.0",
    "pymysql>=1.1",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]
